name: SatelliteT3 Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without v, e.g. 0.1.3 or 0.1.3-beta.1. Builds the selected branch and creates its tag."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: satellite-release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Validate version and resolve commit
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Expected vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          existing=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ { print $1; found=1 } END { if (!found) print first } NR==1 { first=$1 }')
          if [[ -n "$existing" && "$existing" != "$commit" ]]; then
            echo "$RELEASE_TAG already points to a different commit. Choose a new version or run from that tag." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows x64
    needs: prepare
    # Keep Visual Studio 2022 aligned with the packager's node-gyp configuration.
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      T3CODE_DESKTOP_DEV: "0"
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: satellite-windows-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup Python for native dependencies
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure Rust target is installed
        run: rustup target add x86_64-pc-windows-msvc

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Lint Satellite sources and packaging
        run: vp lint apps/desktop/src/satellite apps/desktop/src/boot.ts apps/desktop/src/app/DesktopStatePaths.ts apps/web/src/components/desktop/SatelliteDesktopShell.tsx apps/web/src/satellitePill.ts packages/contracts/src/satellite.ts scripts/satellite-dev.mjs scripts/build-desktop-artifact.ts

      - name: Typecheck desktop and web
        run: |
          vp run --filter @t3tools/desktop typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vp run --filter @t3tools/web typecheck

      - name: Test desktop shell, identity, and startup
        working-directory: apps/desktop
        run: vp test run src/satellite/SatellitePill.test.ts src/satellite/pillModel.test.ts src/window/DesktopWindow.test.ts src/ssh/DesktopSshPasswordPrompts.test.ts src/app/DesktopEnvironment.test.ts src/app/DesktopAppIdentity.test.ts src/app/DesktopEarlyElectronStartup.test.ts scripts/main-process-bundle.test.mjs scripts/dev-electron.test.mjs scripts/verify-preload-bundle.test.mjs

      - name: Test web shell and pill projection
        working-directory: apps/web
        run: vp test run --project unit src/components/desktop/SatelliteDesktopShell.test.tsx src/satellitePill.test.ts

      - name: Test packaging
        run: vp test run scripts/build-desktop-artifact.test.ts

      - name: Build unsigned installer and updater files
        env:
          T3CODE_DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: vp run dist:desktop:win:x64

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = "release/SatelliteT3-$env:RELEASE_VERSION-x64.exe"
          foreach ($path in @($installer, "$installer.blockmap", 'release/latest.yml')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release asset: $path" }
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/SatelliteT3-*-x64.exe
            release/SatelliteT3-*-x64.exe.blockmap
            release/latest.yml

  macos:
    name: Build macOS ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            rust-target: aarch64-apple-darwin
          - arch: x64
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      T3CODE_DESKTOP_DEV: "0"
      T3CODE_DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        run: echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: satellite-macos-${{ matrix.arch }}-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup Python for native dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure native build tools
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          xcrun --find clang
          rustup target add "$RUST_TARGET"
          vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck desktop and web
        run: |
          vp run --filter @t3tools/desktop typecheck
          vp run --filter @t3tools/web typecheck

      - name: Test macOS desktop behavior and startup
        working-directory: apps/desktop
        run: vp test run src/window/DesktopWindow.test.ts src/app/DesktopEnvironment.test.ts src/app/DesktopAppIdentity.test.ts src/app/DesktopEarlyElectronStartup.test.ts src/app/DesktopLifecycle.test.ts src/shell/DesktopShellEnvironment.test.ts src/ipc/methods/notificationBadge.test.ts src/snapShot/ActiveWindow.test.ts src/snapShot/DesktopSnapShot.test.ts scripts/main-process-bundle.test.mjs scripts/dev-electron.test.mjs scripts/verify-preload-bundle.test.mjs

      - name: Test packaging
        run: vp test run scripts/build-desktop-artifact.test.ts

      - name: Build unsigned DMG and ZIP
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: vp run "dist:desktop:dmg:$BUILD_ARCH"

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Collect release assets
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          for extension in dmg zip; do
            asset="release/SatelliteT3-$T3CODE_DESKTOP_VERSION-$BUILD_ARCH.$extension"
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          # Ad-hoc signed builds cannot use Squirrel.Mac automatic updates.
          test ! -e release/latest-mac.yml

      - name: Verify packaged macOS app
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          archive="release/SatelliteT3-$T3CODE_DESKTOP_VERSION-$BUILD_ARCH.zip"
          smoke_dir="$RUNNER_TEMP/satellite-release"
          ditto -x -k "$archive" "$smoke_dir"
          apps=("$smoke_dir"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          codesign --verify --deep --strict "$app"
          test ! -e "$app/Contents/Resources/app-update.yml"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/$executable" "$app/Contents/Resources/app.asar/apps/server/dist/bin.mjs" --help
          hdiutil verify "release/SatelliteT3-$T3CODE_DESKTOP_VERSION-$BUILD_ARCH.dmg"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          if-no-files-found: error
          path: |
            release/SatelliteT3-*.dmg
            release/SatelliteT3-*.zip

  linux:
    name: Build Linux x64
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      T3CODE_DESKTOP_DEV: "0"
      T3CODE_DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        run: echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: satellite-linux-x64-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install native build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 libnotify4 libatspi2.0-0
          rustup target add x86_64-unknown-linux-gnu

      - name: Setup Python for native dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck desktop and web
        run: |
          vp run --filter @t3tools/desktop typecheck
          vp run --filter @t3tools/web typecheck

      - name: Test Linux desktop behavior and startup
        working-directory: apps/desktop
        run: vp test run src/window/DesktopWindow.test.ts src/app/DesktopEnvironment.test.ts src/app/DesktopAppIdentity.test.ts src/app/DesktopEarlyElectronStartup.test.ts src/app/DesktopLifecycle.test.ts src/updates/DesktopUpdates.test.ts scripts/main-process-bundle.test.mjs scripts/dev-electron.test.mjs scripts/verify-preload-bundle.test.mjs

      - name: Test packaging
        run: vp test run scripts/build-desktop-artifact.test.ts

      - name: Build AppImage, Debian package, and updater files
        run: vp run dist:desktop:linux

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Collect release assets
        run: |
          for extension in AppImage deb; do
            asset="release/SatelliteT3-$T3CODE_DESKTOP_VERSION-x64.$extension"
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          test -s release/latest-linux.yml

      - name: Verify packaged Linux app
        run: |
          smoke_dir="$RUNNER_TEMP/satellite-release"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          appimage="$GITHUB_WORKSPACE/release/SatelliteT3-$T3CODE_DESKTOP_VERSION-x64.AppImage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract > /dev/null
          test -s squashfs-root/resources/app-update.yml
          T3CODE_HOME="$smoke_dir/home" ELECTRON_RUN_AS_NODE=1 ./squashfs-root/t3code ./squashfs-root/resources/app.asar/apps/server/dist/bin.mjs --help
          deb="$GITHUB_WORKSPACE/release/SatelliteT3-$T3CODE_DESKTOP_VERSION-x64.deb"
          test "$(dpkg-deb --field "$deb" Architecture)" = amd64
          dpkg-deb --info "$deb"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          if-no-files-found: error
          path: |
            release/SatelliteT3-*-x64.AppImage
            release/SatelliteT3-*-x64.deb
            release/latest-linux.yml

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release

      - name: Check assets and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          cd release
          for asset in "SatelliteT3-$RELEASE_VERSION-x64.exe" "SatelliteT3-$RELEASE_VERSION-x64.exe.blockmap" latest.yml; do
            test -s "$asset"
          done
          for arch in arm64 x64; do
            test -s "SatelliteT3-$RELEASE_VERSION-$arch.dmg"
            test -s "SatelliteT3-$RELEASE_VERSION-$arch.zip"
          done
          for asset in "SatelliteT3-$RELEASE_VERSION-x64.AppImage" "SatelliteT3-$RELEASE_VERSION-x64.deb" latest-linux.yml; do
            test -s "$asset"
          done
          sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          args=(--target "$RELEASE_COMMIT" --generate-notes --title "SatelliteT3 $RELEASE_TAG")
          if [[ "$RELEASE_EVENT" != "workflow_dispatch" ]]; then
            args+=(--verify-tag)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$RELEASE_TAG" release/* "${args[@]}"
