name: SatelliteT3 Release

# Satellite's release: Windows x64 with the fork's update feed, and unsigned
# macOS arm64 and x64 builds for manual install. See docs/operations/release.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, for example 2.0.0 or 2.0.0-beta.1. Builds the selected branch and creates its tag."
        required: true
        type: string
      dry_run:
        description: "Build and check every asset without creating a tag or release"
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Notes shown above the generated pull request list"
        required: false
        default: ""
        type: string

permissions:
  # release-desktop.yml asks for actions: read.
  actions: read
  contents: read

concurrency:
  group: satellite-release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          node scripts/satellite-release-version.ts "$version" >> "$GITHUB_OUTPUT"

      # Rerunning a version from the commit its tag names is safe; reusing the
      # version for a different commit is not.
      - name: Check release tag
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          existing=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ { print $1; found=1 } END { if (!found) print first } NR==1 { first=$1 }')
          if [[ -n "$existing" && "$existing" != "$commit" ]]; then
            echo "$RELEASE_TAG already points to $existing, not $commit. Choose a new version or run from that tag." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The release jobs run no tests, so CI's required Check must already
      # have passed on this exact commit.
      - name: Require passing CI
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?check_name=Check&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
          if [[ "$passed" -eq 0 ]]; then
            echo "CI's Check has not passed on $COMMIT. Wait for SatelliteT3 CI to pass on that commit, then rerun." >&2
            exit 1
          fi

  build_bundle:
    name: Build JS bundle
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"

      # @t3tools/desktop#build compiles the Linux browser secret helper.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [resolve, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false
      # Satellite ships no CLI archive, so Windows builds have no WSL runtime.
      wsl_runtime: false

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [resolve, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [resolve, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS x64
      runner: macos-15-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false

  verify_macos:
    name: Verify macOS ${{ matrix.arch }}
    needs: [resolve, desktop_mac_arm64, desktop_mac_x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Download desktop artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: release

      # Unsigned builds are ad-hoc signed and installed by hand: Squirrel.Mac
      # cannot install an update without a Developer ID signature.
      - name: Verify packaged app
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          stem="release/SatelliteT3-$RELEASE_VERSION-$ARCH"
          extract_dir="$RUNNER_TEMP/satellite-app"
          ditto -x -k "$stem.zip" "$extract_dir"
          apps=("$extract_dir"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          codesign --verify --deep --strict "$app"
          test ! -e "$app/Contents/Resources/app-update.yml"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          T3CODE_HOME="$RUNNER_TEMP/satellite-home" ELECTRON_RUN_AS_NODE=1 \
            "$app/Contents/MacOS/$executable" "$app/Contents/Resources/app.asar/apps/server/dist/bin.mjs" --help
          hdiutil verify "$stem.dmg"

  publish:
    name: Publish GitHub Release
    needs: [resolve, desktop_win_x64, verify_macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts

      # Copies exactly the assets 1.x releases carried, so a missing file fails
      # here and stray build output never ships. The Windows feed manifest goes
      # back to latest.yml, the name installed Windows builds poll.
      - name: Assemble release assets
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          shopt -s nullglob
          mac_feeds=(artifacts/*mac*.yml)
          if [[ ${#mac_feeds[@]} -ne 0 ]]; then
            echo "Unsigned macOS builds must not publish an update feed, found: ${mac_feeds[*]}" >&2
            exit 1
          fi
          mkdir release
          installer="SatelliteT3-$RELEASE_VERSION-x64.exe"
          for asset in "$installer" "$installer.blockmap"; do
            cp "artifacts/$asset" release/
          done
          cp artifacts/latest-win-x64.yml release/latest.yml
          for arch in arm64 x64; do
            for extension in dmg zip; do
              cp "artifacts/SatelliteT3-$RELEASE_VERSION-$arch.$extension" release/
            done
          done
          for asset in release/*; do
            test -s "$asset"
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release

      - name: Upload dry-run assets
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          args=(--target "$RELEASE_COMMIT" --generate-notes --title "SatelliteT3 $RELEASE_TAG")
          if [[ -n "$RELEASE_NOTES" ]]; then
            args+=(--notes "$RELEASE_NOTES")
          fi
          if [[ "$RELEASE_EVENT" != "workflow_dispatch" ]]; then
            args+=(--verify-tag)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$RELEASE_TAG" release/* "${args[@]}"
