name: SatelliteT3 CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satellite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      T3CODE_DESKTOP_DEV: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: satellite-windows-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Lint Satellite sources
        run: vp lint apps/desktop/src/satellite apps/web/src/components/desktop/SatelliteDesktopShell.tsx apps/web/src/satellitePill.ts packages/contracts/src/satellite.ts scripts/satellite-dev.mjs

      - name: Typecheck desktop and web
        run: |
          vp run --filter @t3tools/desktop typecheck
          vp run --filter @t3tools/web typecheck

      - name: Test desktop shell and native integration
        working-directory: apps/desktop
        run: vp test run src/satellite/SatellitePill.test.ts src/satellite/pillModel.test.ts src/window/DesktopWindow.test.ts src/ssh/DesktopSshPasswordPrompts.test.ts

      - name: Test web shell and pill projection
        working-directory: apps/web
        run: vp test run --project unit src/components/desktop/SatelliteDesktopShell.test.tsx src/satellitePill.test.ts

      - name: Test desktop startup and preload verifier
        working-directory: apps/desktop
        run: vp test run scripts/dev-electron.test.mjs scripts/verify-preload-bundle.test.mjs

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs
