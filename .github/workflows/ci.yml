name: SatelliteT3 CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satellite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      T3CODE_DESKTOP_DEV: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        run: echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: satellite-${{ matrix.platform }}-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Lint Satellite sources
        run: vp lint apps/desktop/src/satellite apps/web/src/components/desktop/SatelliteDesktopShell.tsx apps/web/src/satellitePill.ts packages/contracts/src/satellite.ts scripts/satellite-dev.mjs

      - name: Typecheck desktop and web
        run: |
          vp run --filter @t3tools/desktop typecheck
          vp run --filter @t3tools/web typecheck

      - name: Test desktop shell and native integration
        working-directory: apps/desktop
        run: vp test run src/satellite/SatellitePill.test.ts src/satellite/pillModel.test.ts src/window/DesktopWindow.test.ts src/ssh/DesktopSshPasswordPrompts.test.ts src/app/DesktopEnvironment.test.ts src/app/DesktopAppIdentity.test.ts src/app/DesktopLifecycle.test.ts src/shell/DesktopShellEnvironment.test.ts src/ipc/methods/notificationBadge.test.ts src/snapShot/ActiveWindow.test.ts src/snapShot/DesktopSnapShot.test.ts

      - name: Test web shell and pill projection
        working-directory: apps/web
        run: vp test run --project unit src/components/desktop/SatelliteDesktopShell.test.tsx src/satellitePill.test.ts

      - name: Test desktop startup and preload verifier
        working-directory: apps/desktop
        run: vp test run scripts/dev-electron.test.mjs scripts/verify-preload-bundle.test.mjs

      - name: Test packaging
        run: vp test run scripts/build-desktop-artifact.test.ts

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  server:
    name: Server regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        run: echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: satellite-linux-server-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Typecheck server
        run: vp run --filter t3 typecheck

      - name: Lint regression fixes
        run: vp lint apps/server/src/revdoc/RevdocTesting.ts apps/server/src/revdoc/RevdocTesting.test.ts apps/server/src/sourceControl/AzureDevOpsReadApi.ts apps/server/src/sourceControl/AzureDevOpsReadApi.test.ts

      - name: Test fork server services
        working-directory: apps/server
        run: >-
          vp test run
          src/documents/DocumentService.test.ts
          src/ideas/IdeaRuntime.test.ts
          src/git/CommitRecommendationService.test.ts
          src/revdoc/RevdocGeneration.test.ts
          src/revdoc/RevdocService.test.ts
          src/revdoc/RevdocTesting.test.ts
          src/sourceControl/AzureDevOpsReadApi.test.ts
          src/sourceControl/AzureDevOpsCli.test.ts
          src/pullRequest/AzureDevOpsPullRequestCli.test.ts
          src/pullRequest/AzureDevOpsPullRequestProvider.test.ts
          src/pullRequest/azureDevOpsDiff.test.ts
          src/issues/IssueHost.test.ts
          src/issues/IssueService.test.ts
